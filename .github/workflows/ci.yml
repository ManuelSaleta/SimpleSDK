name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Simple.Sdk.slnx

    - name: Build
      run: dotnet build Simple.Sdk.slnx --no-restore --configuration Release

    - name: Run Tests
      run: dotnet test Simple.Sdk.slnx --no-build --configuration Release --verbosity normal

    - name: Pack NuGet Package
      run: dotnet pack src/Simple.Sdk/Simple.Sdk.csproj --no-build --configuration Release --output ./nupkg
